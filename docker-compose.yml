version: '3.8'

services:
  # ---------- Kafka + Zookeeper ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: maritime-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - maritime-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: maritime-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - maritime-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: maritime-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - maritime-net

  # ---------- MinIO (تخزين Bronze/Silver/Gold) ----------
  minio:
    image: minio/minio:latest
    container_name: maritime-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - maritime-net

  # ---------- Spark ----------
  # ملاحظة: تم استبدال bitnami/spark بالصورة الرسمية apache/spark لأن Bitnami
  # أوقفت توفير صور Spark مجانًا على Docker Hub وحولتها لاشتراك مدفوع.
  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: maritime-spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./processing:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - maritime-net

  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: maritime-spark-worker
    user: root
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./processing:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - maritime-net

  # ---------- Postgres (لبيانات Airflow) ----------
  postgres:
    image: postgres:15
    container_name: maritime-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - maritime-net

  # ---------- Airflow ----------
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: maritime-airflow-init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Mohamed --lastname Tarek --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    networks:
      - maritime-net

  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: maritime-airflow-web
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8081:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    networks:
      - maritime-net

  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: maritime-airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    networks:
      - maritime-net

  # ---------- Streamlit Dashboard ----------
  dashboard:
    build: ./dashboard
    container_name: maritime-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    networks:
      - maritime-net

networks:
  maritime-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
